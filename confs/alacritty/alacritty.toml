# =============================================================================
# Alacritty Configuration — Khoa Nguyen
# Docs: https://alacritty.org/config-alacritty.html
# =============================================================================

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
[general]
# Reload config on save without restarting
live_config_reload = true

[env]
# Stable true-color detection across apps / SSH
TERM = "xterm-256color"

# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------

[font]
# Font size in points
size = 9.0

# Use built-in box/block drawing characters for perfect alignment
builtin_box_drawing = true

[font.normal]
family = "UbuntuMono Nerd Font Mono"
style = "Regular"

[font.bold]
style = "Bold"

[font.italic]
style = "Italic"

[font.bold_italic]
style = "Bold Italic"

[font.offset]
x = 0
y = 0

# -----------------------------------------------------------------------------
# Scrolling
# -----------------------------------------------------------------------------

[scrolling]
# Max lines stored in scrollback buffer (0 to disable, max 100000)
history = 10000

# Lines scrolled per scroll event (default 3)
multiplier = 4

# -----------------------------------------------------------------------------
# Window
# -----------------------------------------------------------------------------

[window]
title = "Khoa Nguyen"
opacity = 1.0
dynamic_padding = false
dynamic_title = true
resize_increments = false
decorations = "Full"
decorations_theme_variant = "Dark"
startup_mode = "Windowed"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 4
y = 4

[window.dimensions]
columns = 264
lines = 64

# -----------------------------------------------------------------------------
# Mouse
# -----------------------------------------------------------------------------
[mouse]
# Hide mouse cursor while typing
hide_when_typing = false

# -----------------------------------------------------------------------------
# Keyboard Bindings
# -----------------------------------------------------------------------------

[keyboard]
bindings = [
  # Open a new Alacritty window
  { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },

  # Toggle vi mode for keyboard-driven navigation
  { key = "V", mods = "Alt|Shift", action = "ToggleViMode" },
]

# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------

[cursor.style]
# Shape: "Block" | "Underline" | "Beam"
shape = "Block"

# Blinking: "Never" | "Off" | "On" | "Always"
blinking = "Off"

[cursor]
# Show hollow cursor when window is unfocused
unfocused_hollow = true

# -----------------------------------------------------------------------------
# Terminal
# -----------------------------------------------------------------------------
[terminal]
# Clipboard access via OSC 52 escape sequence
# "Disabled" | "OnlyCopy" | "OnlyPaste" | "CopyPaste"
osc52 = "OnlyCopy"

[terminal.shell]
# Shell program (defaults to $SHELL or login shell from /etc/passwd)
program = "/bin/zsh"
args = ["-l"]

# -----------------------------------------------------------------------------
# Colors — Custom dark theme
# -----------------------------------------------------------------------------

[colors.primary]
background = "#080808"
foreground = "#EEE2DE"
dim_foreground = "#797979"

[colors.cursor]
cursor = "#AF5F5F"
text = "#080808"

[colors.vi_mode_cursor]
cursor = "#7DB9B6"
text = "#080808"

[colors.selection]
text = "#EEE2DE"
background = "#383838"

[colors.search.matches]
foreground = "#080808"
background = "#D59572"

[colors.search.focused_match]
foreground = "#080808"
background = "#EBC17A"

[colors.hints.start]
foreground = "#080808"
background = "#EBC17A"

[colors.hints.end]
foreground = "#080808"
background = "#7DB9B6"

[colors.normal]
black = "#080808"
red = "#AF5F5F"
green = "#87AFAF"
yellow = "#EBC17A"
blue = "#7EAAC7"
magenta = "#924653"
cyan = "#7DB9B6"
white = "#EEE2DE"

[colors.bright]
black = "#797979"
red = "#D68C8C"
green = "#86D3CE"
yellow = "#E5B567"
blue = "#9CC4DC"
magenta = "#C98AAE"
cyan = "#A0D8E8"
white = "#F7F7F7"

[colors.dim]
black = "#181818"
red = "#74423F"
green = "#5C8482"
yellow = "#8B7653"
blue = "#556B79"
magenta = "#6E4962"
cyan = "#5C8482"
white = "#636363"